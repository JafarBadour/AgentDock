name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.8'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Release builds sign with the debug config; restore the shared debug
      # keystore so CI APKs install over locally built ones.
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk AgentDock-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDock-android
          path: AgentDock-android.apk

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/AgentDock-macos.zip" "Agent Dock.app"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDock-macos
          path: AgentDock-macos.zip

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath AgentDock-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDock-windows-x64
          path: AgentDock-windows-x64.zip

  linux:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: |
          tar -czf AgentDock-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDock-linux-x64
          path: AgentDock-linux-x64.tar.gz

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package Agent Dock.app
        run: |
          cd build/ios/iphoneos
          APP="Agent Dock.app"
          if [ ! -d "$APP" ]; then APP="Runner.app"; fi
          zip -r "$GITHUB_WORKSPACE/AgentDock-ios-unsigned.zip" "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDock-ios-unsigned
          path: AgentDock-ios-unsigned.zip

  release:
    name: GitHub Release
    needs: [android, macos, windows, linux, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Agent Dock builds

            - **macOS**: unzip `AgentDock-macos.zip` and open `Agent Dock.app`
            - **Android**: install `AgentDock-android.apk` (sideload)
            - **Windows**: unzip `AgentDock-windows-x64.zip` and run `agent_dock.exe`
            - **Linux (Ubuntu)**: `tar -xzf AgentDock-linux-x64.tar.gz` then run `./agent_dock`
            - **iOS**: `AgentDock-ios-unsigned.zip` contains unsigned `Agent Dock.app` — sign with your Apple Developer team in Xcode before installing on a device or submitting to App Store Connect
          files: |
            artifacts/AgentDock-macos/AgentDock-macos.zip
            artifacts/AgentDock-android/AgentDock-android.apk
            artifacts/AgentDock-windows-x64/AgentDock-windows-x64.zip
            artifacts/AgentDock-linux-x64/AgentDock-linux-x64.tar.gz
            artifacts/AgentDock-ios-unsigned/AgentDock-ios-unsigned.zip
