name: agent_dock
description: Mobile Agents window over SSH — Cursor ACP on remote hosts via tmux.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  flutter_secure_storage: ^9.2.4
  dartssh2: ^2.12.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  xterm: ^4.0.0
  file_picker: ^11.0.3
  url_launcher: ^6.3.2
  flutter_linkify: ^6.0.0
  gpt_markdown: ^1.2.1
  markdown: ^7.3.1
  super_clipboard: ^0.9.1
  share_plus: ^12.0.2
  flutter_foreground_task: ^10.0.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  record: ^6.2.1
  flutter_local_notifications: ^22.3.0
  speech_to_text: ^7.4.0
  pdfrx: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.0+3

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - host/adsm/__init__.py
    - host/adsm/__main__.py
    - host/adsm/paths.py
    - host/adsm/protocol.py
    - host/adsm/worker.py
    - host/adsm/daemon.py
    - host/adsm/cli.py
    - host/adsm/scheduler.py
    - host/adsm/transcript.py
